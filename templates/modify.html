<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un Article</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-center min-h-screen text-white p-4 sm:p-6">

    <div class="bg-gray-900 rounded-3xl shadow-2xl p-6 sm:p-12 w-full max-w-3xl">
        <h1 class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-10 text-center text-green-500">Modifier un Article</h1>

        <form method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
            <div class="flex flex-col">
                <label class="mb-1 sm:mb-2 font-medium text-white">Titre :</label>
                <input type="text" name="titre" value="{{ produit.titre }}"
                       class="w-full border border-green-500 rounded-lg px-3 sm:px-4 py-2 sm:py-3 bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <div class="flex flex-col">
                <label class="mb-1 sm:mb-2 font-medium text-white">Auteur :</label>
                <input type="text" name="auteur" value="{{ produit.auteur }}"
                       class="w-full border border-green-500 rounded-lg px-3 sm:px-4 py-2 sm:py-3 bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <div class="flex flex-col">
                <label class="mb-1 sm:mb-2 font-medium text-white">Catégorie :</label>
                <input type="text" name="categorie" value="{{ produit.categorie }}"
                       class="w-full border border-green-500 rounded-lg px-3 sm:px-4 py-2 sm:py-3 bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <div class="flex flex-col">
                <label class="mb-1 sm:mb-2 font-medium text-white">Date :</label>
                <input type="date" name="date" value="{{ produit.date }}"
                       class="w-full border border-green-500 rounded-lg px-3 sm:px-4 py-2 sm:py-3 bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <div class="col-span-1 md:col-span-2 mt-4 sm:mt-6">
                <input type="submit" value="Modifier"
                       class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2 sm:py-3 rounded-lg transition-all cursor-pointer">
            </div>
        </form>

        <div class="mt-6 sm:mt-8 text-center">
            <a href="{{ url_for('home') }}" class="text-green-500 hover:text-green-600 font-medium">Retour</a>
        </div>
    </div>

</body>
</html>
