<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Articles</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white">

    <div class="max-w-4xl mx-auto py-8 sm:py-12 px-4 sm:px-6">
        <h1 class="text-2xl sm:text-3xl font-extrabold mb-6 sm:mb-8 text-center text-green-500">Recherche un Article</h1>

        <form method="post" action="{{ url_for('search') }}" class="flex flex-col sm:flex-row gap-3 sm:gap-4 mb-6 sm:mb-8">
            <input type="text" name="mot_cle" placeholder="Entrez auteur, titre ou catégorie"
                class="flex-1 border border-green-600 bg-black text-white rounded-lg p-2 sm:p-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            <button type="submit"
                class="bg-green-500 text-white font-semibold py-2 sm:py-3 px-4 sm:px-6 rounded-lg hover:bg-green-600 transition duration-300">
                Rechercher
            </button>
        </form>

        <div class="mb-6 sm:mb-8 text-center">
            <a href="{{ url_for('create_post') }}"
                class="bg-green-500 text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg font-semibold hover:bg-green-600 transition">
                Ajouter un Article
            </a>
        </div>

        <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-6 text-green-500 text-center">Liste des Articles</h2>
        <ul class="space-y-4">
            {% for p in produits %}
            <li class="bg-gray-900 p-4 sm:p-5 rounded-2xl shadow-lg flex flex-col sm:flex-row justify-between items-start sm:items-center hover:shadow-green-600 transition">
                <div class="mb-3 sm:mb-0">
                    <p class="font-semibold text-lg sm:text-xl text-white">{{ p.titre }}</p>
                    <p class="text-green-400 text-sm sm:text-base">Par : {{ p.auteur }} | {{ p.categorie }}</p>
                    <p class="text-white text-sm sm:text-base">le: {{ p.date_creation }}</p>
                </div>
                <div class="flex gap-2 sm:gap-3 flex-wrap">
                    <a href="{{ url_for('show_post', id_post=p.id) }}"
                        class="w-full sm:w-20 h-10 flex items-center justify-center bg-green-500 text-white rounded-lg hover:bg-green-600 transition font-medium">
                        Voir
                    </a>
                    <a href="{{ url_for('modify_post', id_post=p.id) }}"
                        class="w-full sm:w-20 h-10 flex items-center justify-center bg-green-500 text-white rounded-lg hover:bg-green-600 transition font-medium">
                        Modifier
                    </a>
                    <a href="{{ url_for('delete_post', id_post=p.id) }}"
                        class="w-full sm:w-20 h-10 flex items-center justify-center bg-green-500 text-white rounded-lg hover:bg-green-600 transition font-medium">
                        Supprimer
                    </a>
                </div>
            </li>
            {% endfor %}
            {% if not produits %}
            <li class="text-center text-gray-500">Aucun Article trouvé.</li>
            {% endif %}
        </ul>
    </div>

</body>

</html>
